<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="320" height="250" font-family="system-ui, sans-serif" font-size="18">
  <title>Rechtwinkliges Dreieck mit a = 3 cm und b = 4 cm</title>
  <polygon points="40,210 280,210 40,30" fill="#e8f0fb" stroke="#1d2433" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="40,188 62,188 62,210" fill="none" stroke="#1d2433" stroke-width="2"/>
  <text x="18" y="126" text-anchor="middle">a</text>
  <text x="160" y="236" text-anchor="middle">b</text>
  <text x="172" y="110" text-anchor="middle">c</text>
  <text x="70" y="140" font-size="14" fill="#5b6475">3 cm</text>
  <text x="140" y="200" font-size="14" fill="#5b6475">4 cm</text>
</svg>
