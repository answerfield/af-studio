<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>answerfield Playground</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #1d2433; --muted: #5b6475; --border: #d0d5dd; --surface: #f4f6fa;
      --ok: #19765a; --warning: #9a5800; --error: #b42318;
      --accent: #2f62b8; --active-line: #eef2f8; --selection: #cddcf5;
      --hl-comment: #6a737d; --hl-string: #0b6e4f; --hl-number: #9a5800; --hl-keyword: #2f62b8;
      --hl-type: #7b48b5; --hl-property: #1d2433; --hl-function: #8a3b12;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #16191f; --fg: #e3e6eb; --muted: #9aa3b2; --border: #343a46; --surface: #1e222a;
        --ok: #4cc39a; --warning: #e0a050; --error: #f07a6e;
        --accent: #3b74d6; --active-line: #1f242d; --selection: #2c4366;
        --hl-comment: #8b949e; --hl-string: #7ccfa8; --hl-number: #e0a050; --hl-keyword: #7fa8ef;
        --hl-type: #c49cf0; --hl-property: #e3e6eb; --hl-function: #f0a37a;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, sans-serif; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
    h1 { margin: 0; font-size: 16px; font-weight: 600; }
    label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
    select, button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
    button { cursor: pointer; }
    #status { margin-left: auto; color: var(--muted); }
    #status[data-state="ok"]::before { content: "● "; color: var(--ok); }
    #status[data-state="warning"]::before { content: "● "; color: var(--warning); }
    #status[data-state="error"]::before { content: "● "; color: var(--error); }
    main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; }
    #editor { min-height: 0; overflow: hidden; border-right: 1px solid var(--border); }
    #editor .cm-editor { height: 100%; }
    #editor .cm-scroller { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    #preview { width: 100%; height: 100%; border: 0; background: var(--bg); }
    .af-hover { max-width: 520px; padding: 4px 10px; }
    .af-hover p { margin: 6px 0; }
    .af-hover pre { margin: 6px 0; padding: 6px 8px; background: var(--surface); border-radius: 4px; white-space: pre-wrap; font: 12px/1.45 ui-monospace, Menlo, monospace; }
    .af-hover hr { border: 0; border-top: 1px solid var(--border); margin: 6px 0; }
    .af-hover ul { margin: 6px 0; padding-left: 18px; }
    .af-hover code { font: 12px ui-monospace, Menlo, monospace; }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; grid-template-rows: minmax(300px, 1fr) minmax(400px, 1fr); }
      #editor { border-right: 0; border-bottom: 1px solid var(--border); }
      #status { margin-left: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>answerfield Playground</h1>
    <label>Beispiel <select id="example"></select></label>
    <button id="reset" type="button" title="Eigene Änderungen an dieser Datei verwerfen">Zurücksetzen</button>
    <span id="status" aria-live="polite">Lädt …</span>
  </header>
  <main>
    <div id="editor"></div>
    <iframe id="preview" title="Vorschau der Aufgabe"></iframe>
  </main>
  <script src="app.js"></script>
</body>
</html>
